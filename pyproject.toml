[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "activity-parser"
version = "0.1.0"
description = "Parser for loading FIT, TCX and GPX files into Pandas DataFrames."
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "lxml",
    "fitdecode",
]

[tool.ruff]
line-length = 80
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "PL", "UP"]
