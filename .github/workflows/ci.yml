name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 1,15 * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python-version }}
      - run: uv run pre-commit run --all-files
      - run: uv build
